# Render Blueprint — backend deployment
# Push the repo to GitHub, then on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: shopkart-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render injects its own PORT; 10000 is the free-tier default
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app # ← replace with your Vercel URL
      - key: MONGO_URI
        sync: false # set manually (MongoDB Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
